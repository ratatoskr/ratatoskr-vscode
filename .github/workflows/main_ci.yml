name: ci

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.head_ref || github.run_id }}-${{ github.actor }}
  cancel-in-progress: true

jobs:
  test:
    name: test and package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: checkout repository
        uses: actions/checkout@v7

      - name: install node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: install packages
        run: npm ci

      - name: test
        run: npm test

      # Catches what only packaging checks, like a broken manifest or a missing file
      - name: package
        run: npm run package

      - name: upload the extensions
        uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: packages/*/*.vsix
